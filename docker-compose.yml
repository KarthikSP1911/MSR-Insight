version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: msr_insight_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-msr_insight}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-msr_insight}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - msr_network

  redis:
    image: redis:7-alpine
    container_name: msr_insight_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - msr_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: msr_insight_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msr_network

  fastapi:
    build:
      context: ./backend/fastapi
      dockerfile: Dockerfile
    container_name: msr_insight_fastapi
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-msr_insight}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434}
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msr_network

  express:
    build:
      context: ./backend/express
      dockerfile: Dockerfile
    container_name: msr_insight_express
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-msr_insight}
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - FASTAPI_URL=http://fastapi:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434}
    # Command ensures DB schema is pushed before starting the server
    command: sh -c "npx prisma db push && node server.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      fastapi:
        condition: service_started
    networks:
      - msr_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5001/api
        - NEXT_PUBLIC_FASTAPI_URL=http://localhost:8000
    container_name: msr_insight_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
      - NEXT_PUBLIC_FASTAPI_URL=http://localhost:8000
    depends_on:
      - express
    networks:
      - msr_network

volumes:
  postgres_data:
  redis_data:

networks:
  msr_network:
    driver: bridge
