<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 848" width="1360" height="848" role="img" aria-labelledby="t d">
<title id="t">MSR Insight high-level architecture</title>
<desc id="d">A user reaches the Next.js web app over HTTP; the web app and the Chrome extension call the Express API gateway. The gateway fans out to the FastAPI AI service (Chroma vectors, Groq and Gemini, Postgres), student data in Neon Postgres via Prisma, a Puppeteer scraper for the MSRIT parents portal, cookie-session auth backed by Redis, and a RabbitMQ email queue consumed by an email worker that archives PDFs to Cloudinary and sends via Resend and Twilio. The web app calls the AI service directly for RAG chat, and the AI service calls back into the gateway for confirmed sends.</desc>
